apiVersion: "v1"
kind: "Pod"
metadata:
  name: "privileged"
  namespace: "devsecops-reference"
  labels:
    app: "sample-api"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "sample-api"
      image: "devsecops-reference:local"
      securityContext:
        # Kubernetes rejects privileged=true combined with escalation=false.
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
        privileged: true
      resources:
        limits:
          cpu: "250m"
          memory: "128Mi"
