apiVersion: "cli.kyverno.io/v1alpha1"
kind: "Test"
metadata:
  name: "active-exception"
policies:
  - "../../require-resource-limits.yaml"
  - "../../disallow-privileged.yaml"
resources:
  - "../../../fixtures/missing-limits.yaml"
  - "../../../fixtures/init-missing-limits.yaml"
  - "../../../fixtures/privileged.yaml"
exceptions:
  - "exception.yaml"
results:
  -
    isValidatingPolicy: true
    policy: "require-resource-limits"
    kind: "Pod"
    resources:
      - "missing-limits"
    result: "skip"
  -
    isValidatingPolicy: true
    policy: "require-resource-limits"
    kind: "Pod"
    resources:
      - "init-missing-limits"
    result: "fail"
  -
    isValidatingPolicy: true
    policy: "disallow-privileged"
    kind: "Pod"
    resources:
      - "privileged"
    result: "fail"
