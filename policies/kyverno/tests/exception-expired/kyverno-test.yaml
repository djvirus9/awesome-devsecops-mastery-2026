apiVersion: "cli.kyverno.io/v1alpha1"
kind: "Test"
metadata:
  # CLI 1.19.1 does not enforce expiresAt when supplied an exception file.
  # Check unrelated scopes here; exact-object expiry is a mandatory live test.
  name: "expired-exception-unaffected-controls"
policies:
  - "../../require-resource-limits.yaml"
  - "../../disallow-privileged.yaml"
resources:
  - "../../../fixtures/init-missing-limits.yaml"
  - "../../../fixtures/privileged.yaml"
exceptions:
  - "exception.yaml"
results:
  -
    isValidatingPolicy: true
    policy: "require-resource-limits"
    kind: "Pod"
    resources:
      - "init-missing-limits"
    result: "fail"
  -
    isValidatingPolicy: true
    policy: "disallow-privileged"
    kind: "Pod"
    resources:
      - "privileged"
    result: "fail"
