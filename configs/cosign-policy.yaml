apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: require-reference-release-provenance
spec:
  images:
    - glob: "ghcr.io/djvirus9/awesome-devsecops-mastery-2026/sample-api:*"
    - glob: "ghcr.io/djvirus9/awesome-devsecops-mastery-2026/sample-api@sha256:*"
  authorities:
    # Cosign 3 plain-signature bundles are not accepted by this controller's
    # signature API. Verify the release's signed SLSA v1 provenance bundle.
    - signatureFormat: bundle
      attestations:
        - name: release-provenance
          predicateType: https://slsa.dev/provenance/v1
      keyless:
        url: "https://fulcio.sigstore.dev"
        identities:
          - issuer: "https://token.actions.githubusercontent.com"
            subject: "https://github.com/djvirus9/awesome-devsecops-mastery-2026/.github/workflows/release.yml@refs/heads/main"
      ctlog:
        url: "https://rekor.sigstore.dev"
